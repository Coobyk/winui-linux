[package]
name = "winui-gallery"
edition.workspace = true
license.workspace = true

[[bin]]
name = "winui-gallery"
path = "src/main.rs"

[[bin]]
name = "winui-apps"
path = "src/bin/apps/main.rs"

[dependencies]
# `tooling` keeps Rune's headless CLI (--scene/--theme/--snap/--at) in release builds too.
rune = { workspace = true, features = ["tooling"] }
anyhow.workspace = true
winui-theme = { path = "../winui-theme" }
winui-icons = { path = "../winui-icons" }
winui-materials = { path = "../winui-materials" }
winui-controls = { path = "../winui-controls" }
